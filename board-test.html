<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Board Harness</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1a45; font-family: var(--font-body); }
      #stage { position: fixed; inset: 0; }
      #panel {
        position: fixed; top: 8px; right: 8px; width: 290px; max-height: calc(100% - 16px); overflow: auto;
        padding: 10px; border-radius: 14px; background: rgba(12, 22, 60, 0.82); color: #fff; font-size: 12px;
        backdrop-filter: blur(6px); z-index: 10;
      }
      #panel h4 { margin: 8px 0 4px; font: 400 14px var(--font-display); letter-spacing: 0.03em; }
      #panel button { font: 700 11px var(--font-body); padding: 5px 7px; margin: 2px; border-radius: 8px; border: 0; background: #3a6fe0; color: #fff; cursor: pointer; }
      #panel button:active { transform: translateY(1px); }
      #panel input, #panel select { width: 52px; font-size: 11px; }
      #stats { font: 600 11px monospace; color: #9ff7b2; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #fff; font: 400 28px var(--font-display); z-index: 5; }
      .inset { position: fixed; background: rgba(255, 0, 120, 0.18); outline: 1px dashed rgba(255, 0, 120, 0.7); pointer-events: none; z-index: 4; display: none; }
      #gallery { position: fixed; left: 8px; bottom: 8px; right: 310px; display: none; flex-wrap: wrap; gap: 6px; z-index: 9;
        background: rgba(12, 22, 60, 0.85); padding: 8px; border-radius: 12px; max-height: 60%; overflow: auto; }
      #gallery figure { margin: 0; text-align: center; color: #fff; font-size: 10px; }
      #gallery img { width: 128px; height: 128px; display: block; background: repeating-conic-gradient(#ffffff22 0 25%, #00000022 0 50%) 0 0 / 16px 16px; border-radius: 8px; }
      body.clean #panel, body.clean .inset { display: none !important; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="loading">Loading… <span id="pct">0%</span></div>
    <div class="inset" id="in-top"></div>
    <div class="inset" id="in-bottom"></div>
    <div id="gallery"></div>
    <div id="panel"></div>
    <script type="module" src="/src/board/dev.ts"></script>
  </body>
</html>
